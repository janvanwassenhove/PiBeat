name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger, for environments where pushing a tag is not possible.
  # The tag is created by tauri-action at the ref this run was started from,
  # so dispatch it against the commit you actually want released.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.3.0 (must match the version in package.json)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # A tag push already carries the tag in github.ref_name; a manual run gets it
  # from the input. Resolved once here so both jobs use the same value.
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Pick the tag
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag '$TAG' must start with 'v'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  build:
    needs: resolve-tag
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: ''
          - os: macos-latest
            platform: macos
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            platform: linux
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure sc-bundle exists
        shell: bash
        run: |
          mkdir -p src-tauri/sc-bundle
          if [ -z "$(ls -A src-tauri/sc-bundle 2>/dev/null)" ]; then
            echo "placeholder" > src-tauri/sc-bundle/.gitkeep
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve-tag.outputs.tag }}
          releaseName: 'PiBeat ${{ needs.resolve-tag.outputs.tag }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## 🎵 PiBeat

            Desktop music live-coding — write Sonic Pi code and hear it instantly.

            ### Screenshots

            | Editor & Waveform | Agent Chat |
            |:-:|:-:|
            | ![Editor](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/editor.png) | ![Agent Chat](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/agent-chat.png) |

            | Timeline View | Band Visualizer |
            |:-:|:-:|
            | ![Timeline](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/timeline.png) | ![Band Visualizer](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/band-visualizer.png) |

            ### 📥 Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows | `.msi` / `.exe` | Windows 10+ |
            | 🍎 macOS | `.dmg` (Universal) | Intel + Apple Silicon |
            | 🐧 Linux | `.deb` / `.AppImage` | Ubuntu 22.04+ |

            ### ✨ Highlights
            - Sonic Pi-compatible live coding editor with Monaco
            - Real-time waveform visualization (wave, bars, lissajous)
            - 42 synth types, 13 effects, built-in sample library
            - AI assistant (OpenAI / Anthropic / Gemini) for code generation
            - Detachable panels, timeline view, band visualizer
            - SuperCollider integration for professional sound quality

            ### 🚀 First-time Setup
            1. Download and install for your platform
            2. Open the editor and start writing Sonic Pi code
            3. *(Optional)* Open Settings in Agent Chat to configure an AI provider

  publish-release:
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest

    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.resolve-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false
