name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: ''
          - os: macos-latest
            platform: macos
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            platform: linux
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PiBeat ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update release with notes and screenshots
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'PiBeat ${{ steps.version.outputs.VERSION }}'
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎵 PiBeat ${{ steps.version.outputs.VERSION }}

            Desktop music live-coding — write Sonic Pi code and hear it instantly.

            ### Screenshots

            | Editor & Waveform | Agent Chat |
            |:-:|:-:|
            | ![Editor](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/editor.png) | ![Agent Chat](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/agent-chat.png) |

            | Timeline View | Band Visualizer |
            |:-:|:-:|
            | ![Timeline](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/timeline.png) | ![Band Visualizer](https://raw.githubusercontent.com/janvanwassenhove/PiBeat/main/screenshots/band-visualizer.png) |

            ### 📥 Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows | `.msi` / `.exe` | Windows 10+ |
            | 🍎 macOS | `.dmg` (Universal) | Intel + Apple Silicon |
            | 🐧 Linux | `.deb` / `.AppImage` | Ubuntu 22.04+ |

            ### ✨ Highlights
            - Sonic Pi-compatible live coding editor with Monaco
            - Real-time waveform visualization (wave, bars, lissajous)
            - 42 synth types, 13 effects, built-in sample library
            - AI assistant (OpenAI / Anthropic / Gemini) for code generation
            - Detachable panels, timeline view, band visualizer
            - SuperCollider integration for professional sound quality

            ### 🚀 First-time Setup
            1. Download and install for your platform
            2. Open the editor and start writing Sonic Pi code
            3. *(Optional)* Open Settings in Agent Chat to configure an AI provider

            ### 🔄 Auto-Update
            Existing installations will be notified of new versions automatically (requires updater signing keys).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
